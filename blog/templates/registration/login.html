{% extends 'blog/base.html' %}

{% block content %}
  <h2>Iniciar sesión</h2>
  {% if form.errors %}
    <p>Tu usuario o contraseña no coinciden. Inténtalo de nuevo.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
{% endblock %}
